<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title description">
  <title id="title">BalDent Çocuk Diş Kliniği</title>
  <desc id="description">BalDent logosu ve gülümseyen diş maskotuna sarılan sevimli bir arı.</desc>
  <defs>
    <linearGradient id="tooth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e8f8fb"/>
